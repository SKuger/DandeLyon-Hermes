name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: default install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements-dev.txt

      - run: ruff check app tests

      # No secrets configured, which is the point: the suite runs
      # against the scripted provider, the lexical index and the
      # in-memory store. The LangGraph and MCP tests skip themselves
      # here, which is how we know they are genuinely optional.
      - run: pytest -q

